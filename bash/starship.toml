# Prompt sits on the first line, with no blank line above it after `clear`
# or when a new shell starts.
add_newline = false

# Keep the default module order, replacing git_status with its trimmed version.
format = """
$username$hostname$localip$shlvl$singularity$kubernetes$nats\
$directory$vcsh$fossil_branch$fossil_metrics\
$git_branch$git_commit$git_state$git_metrics${custom.git_status}$all"""

# ~~~~~~~~~~~~~~~~~~~~~~~~~~~     DIRECTORY     ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ #
[directory]
style = "fg:#6A8AEA"
truncation_length = 10
truncate_to_repo = true
fish_style_pwd_dir_length = 3

# Strip the leading "$HOME/" (and the common XDG dirs) so paths read
# "dotfiles/nvim", not "~/dotfiles/nvim".
# The trailing "/" is required on every key: substitutions replace *every*
# match, so a bare "/" entry would delete all separators, not just the first.
[directory.substitutions]
"Documents/" = ""
"Music/" = ""
"Movies/" = ""
"Pictures/" = ""
"Sources/" = ""
"Downloads/" = ""
"~/" = ""

[line_break]
disabled = true # leave as TRUE  

[character]
success_symbol = "[󰁔](fg:#6A8AEA) "
error_symbol = "[](fg:#d56767)[ ](fg:#d56767) "
format = "$symbol"
disabled = false
# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~     ...........       ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ #


# ~~~~~~~~~~~~~~~~~~~~~~~~~~~ GIT ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ #
[git_branch]
disabled = false
symbol = " "
style = "fg:#b79999"
truncation_length = 5                                 # length == ABCDE
format = '[$symbol$branch(:$remote_branch)]($style) ' # this sets path ../../../../

[git_commit]
disabled = false
commit_hash_length = 1

[git_state]
disabled = false
rebase = "rebasing"
merge = "merging"
revert = "reverting"
cherry_pick = " picking"
bisect = "bisecting"
am = "am'ing"
am_or_rebase = "am/rebase"

[git_status]
# Rendered by custom.git_status below; `starship module` still reads this config.
disabled = true
style = "fg:#5F8575"
stashed = "${count} "
ahead = "󰞙${count} "
behind = "󰞒${count} "
diverged = "󰵉${ahead_count} ${behind_count} "
conflicted = "${count} "
deleted = "${count} "
renamed = "${count} "
modified = "${count} "
staged = "${count} "
untracked = "󱅘${count} "

[custom.git_status]
description = "Git status with spaces between items, but none inside bracket edges"
when = true
require_repo = true
shell = ["sh"]
command = "starship module git_status | sed 's/ ]/]/g'"
format = '($output )'
# Preserve the built-in module's ANSI colors.
unsafe_no_escape = true
# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~     ...........       ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ #


# ~~~~~~~~~~~~~~~~~~~~~~~~~~~     LANGUAGES     ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ #
[java]
disabled = false
symbol = "•  "
format = '[${symbol}]($style)'
style = "fg:#a48989"

[python]
disabled = false
pyenv_version_name = false
python_binary = 'python'
format = '[${symbol}(\($virtualenv\))]($style)'
style = "fg:#a48989"
symbol = "• 󱔎 "

[lua]
disabled = false
symbol = "• "
format = '[${symbol}]($style)'
style = "fg:#a48989"

[nodejs]
disabled = false
symbol = "• 󰎙 "
format = '[${symbol}]($style)'
style = "fg:#a48989"

[package]
disabled = false
symbol = "•  "
display_private = false
format = '[${symbol}]($style)'
style = "fg:#a48989"

[docker_context]
disabled = false
symbol = "•  "
only_with_files = true
format = '[${symbol}]($style)'
style = "fg:#a48989"

[golang]
disabled = false
symbol = "•  "
format = '[${symbol}]($style)'
style = "fg:#a48989"
# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~     ...........       ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ #
