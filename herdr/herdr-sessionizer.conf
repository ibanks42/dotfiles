TS_SEARCH_PATHS=(
  "$HOME/dev/work"
  "$HOME/dev/personal"
  "$HOME/dev/herdr"
  "$HOME/dev/"
  "$HOME/.config"
  "$HOME/.codex/worktrees:2"
  "$HOME/.local/share/opencode/worktree/"
  "$HOME"
)

# New workspaces open one tab per entry: non-empty entries run in that tab,
# empty entries stay blank shells. Mirrors tmux's TS_WINDOW_COMMANDS.
# TS_WINDOW_LABELS names the tabs in the same order.
TS_WINDOW_COMMANDS=(
  "pi"
  "nvim"
  ""
  ""
)
TS_WINDOW_LABELS=(
  "1"
  "2"
  "3"
  "4"
)
